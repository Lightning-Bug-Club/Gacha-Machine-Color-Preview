<!--
  machine-front.svg — Stylized placeholder front view for the Phase 1 2D customizer.

  SVG replacement convention:
  * Keep each colorable region on its own element or group.
  * Use id="part-<svg-fragment-id>" on the recolorable element.
  * Use data-part="<logical-part-id>" so the UI can map clicks to data/parts.json.
  * Most parts use the same logical id for both values.
  * Bottom Plate / Mouth is the exception: it stays one logical part in parts.json,
    but colors two SVG elements together via:
      - id="part-bottom-plate" data-part="bottom-plate-mouth"
      - id="part-mouth"        data-part="bottom-plate-mouth"
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" width="320" height="520">
  <!-- Back cover shown as a slim rear panel on the right edge. -->
  <rect id="part-back-cover" data-part="back-cover"
        x="274" y="92" width="20" height="360" rx="5"
        fill="#545454" stroke="#222" stroke-width="1.5"/>

  <!-- Top lid and lock hardware. -->
  <rect id="part-lid" data-part="lid"
        x="62" y="38" width="196" height="54" rx="27"
        fill="#00AE42" stroke="#222" stroke-width="1.5"/>
  <rect id="part-lid-lock" data-part="lid-lock"
        x="140" y="88" width="40" height="18" rx="5"
        fill="#545454" stroke="#222" stroke-width="1.5"/>

  <!-- Main top chamber and viewing window. -->
  <rect id="part-top-chamber" data-part="top-chamber"
        x="50" y="100" width="220" height="166" rx="12"
        fill="#0056B8" stroke="#222" stroke-width="1.5"/>
  <ellipse id="part-window" data-part="window"
           cx="160" cy="182" rx="78" ry="62"
           fill="#0086D6" fill-opacity="0.62" stroke="#222" stroke-width="1.5"/>

  <!-- Upper internal mechanism placeholder. -->
  <rect id="part-hole-blocker" data-part="hole-blocker"
        x="102" y="272" width="116" height="26" rx="5"
        fill="#FFFFFF" stroke="#222" stroke-width="1.5"/>
  <rect id="part-mid-plate" data-part="mid-plate"
        x="44" y="300" width="232" height="18" rx="4"
        fill="#545454" stroke="#222" stroke-width="1.5"/>
  <circle id="part-main-gear" data-part="main-gear"
          cx="160" cy="244" r="38"
          fill="#8E9089" stroke="#222" stroke-width="1.5"/>
  <circle cx="160" cy="244" r="30" fill="none" stroke="#545454" stroke-width="2" stroke-dasharray="7 5"/>
  <circle cx="160" cy="244" r="9" fill="#545454"/>

  <!-- Coin mechanism assembly. -->
  <rect id="part-coin-mech-back-plate" data-part="coin-mech-back-plate"
        x="58" y="330" width="82" height="112" rx="4"
        fill="#545454" stroke="#222" stroke-width="1.5"/>
  <rect id="part-coin-mech-front-plate" data-part="coin-mech-front-plate"
        x="64" y="336" width="70" height="100" rx="4"
        fill="#0056B8" stroke="#222" stroke-width="1.5"/>
  <circle id="part-coin-mech-gear" data-part="coin-mech-gear"
          cx="99" cy="384" r="25"
          fill="#8E9089" stroke="#222" stroke-width="1.5"/>
  <circle cx="99" cy="384" r="19" fill="none" stroke="#545454" stroke-width="2" stroke-dasharray="6 4"/>
  <circle id="part-knob" data-part="knob"
          cx="99" cy="420" r="14"
          fill="#C12E1F" stroke="#222" stroke-width="1.5"/>
  <circle id="part-coin" data-part="coin"
          cx="206" cy="360" r="19"
          fill="#BEC3C6" stroke="#222" stroke-width="1.5"/>
  <path d="M196 360h20M206 350v20" stroke="#7B7F83" stroke-width="2" stroke-linecap="round"/>

  <!-- Linked Bottom Plate / Mouth logical part (two SVG elements, one color). -->
  <rect id="part-bottom-plate" data-part="bottom-plate-mouth"
        x="38" y="454" width="244" height="30" rx="5"
        fill="#545454" stroke="#222" stroke-width="1.5"/>
  <rect id="part-mouth" data-part="bottom-plate-mouth"
        x="108" y="414" width="128" height="28" rx="12"
        fill="#545454" stroke="#222" stroke-width="1.5"/>
  <rect x="118" y="421" width="108" height="10" rx="5" fill="#151515"/>

  <!-- Rear lock knob accessory. -->
  <circle id="part-rear-lock-knob" data-part="rear-lock-knob"
          cx="283" cy="354" r="12"
          fill="#C12E1F" stroke="#222" stroke-width="1.5"/>

  <!-- Simple machine label kept outside the recolorable parts list. -->
  <text x="160" y="72" text-anchor="middle" font-family="sans-serif"
        font-size="12" fill="#FFFFFF" font-weight="bold">Gata-Gata</text>
</svg>
