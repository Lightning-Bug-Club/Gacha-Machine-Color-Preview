<!--
  machine-front.svg — Placeholder front-orthographic view of the Gata-Gata Gacha Machine.

  CONVENTION FOR REPLACEMENT:
  Each colorable part is a <path> or <g> with:
    id="part-<partId>"           (must match an "id" in data/parts.json)
    data-part="<partId>"         (same value — used by viewer2d.js for recoloring)

  When you create your real layered SVG:
  1. Give every colorable region id="part-<id>" and data-part="<id>" matching parts.json.
  2. Drop the SVG into assets/machine-front.svg (or update the path in src/viewer2d.js).
  3. No code changes needed — viewer2d.js detects parts by data-part attribute.

  Parts defined in data/parts.json:
    lid, lid-lock, top-chamber, window, hole-blocker, mid-plate, main-gear,
    coin-mech-back-plate, coin-mech-front-plate, coin-mech-gear, knob, mouth,
    bottom-chamber, rear-lock-knob, bottom-plate, back-cover
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="300" height="500">

  <!-- ═══════════════════════ BASE / BOTTOM PLATE ═══════════════════════ -->
  <!-- Bottom structural plate -->
  <rect id="part-bottom-plate" data-part="bottom-plate"
        x="30" y="455" width="240" height="30" rx="4"
        fill="#545454" stroke="#222" stroke-width="1.5"/>

  <!-- ═══════════════════════ BOTTOM CHAMBER ════════════════════════════ -->
  <!-- Lower housing / coin mechanism housing -->
  <rect id="part-bottom-chamber" data-part="bottom-chamber"
        x="40" y="320" width="220" height="140" rx="6"
        fill="#0056B8" stroke="#222" stroke-width="1.5"/>

  <!-- ═══════════════════════ COIN MECH BACK PLATE ══════════════════════ -->
  <rect id="part-coin-mech-back-plate" data-part="coin-mech-back-plate"
        x="50" y="330" width="80" height="120" rx="3"
        fill="#545454" stroke="#222" stroke-width="1"/>

  <!-- ═══════════════════════ COIN MECH FRONT PLATE ═════════════════════ -->
  <rect id="part-coin-mech-front-plate" data-part="coin-mech-front-plate"
        x="55" y="335" width="70" height="110" rx="3"
        fill="#0056B8" stroke="#222" stroke-width="1"/>

  <!-- ═══════════════════════ COIN MECH GEAR ════════════════════════════ -->
  <circle id="part-coin-mech-gear" data-part="coin-mech-gear"
          cx="90" cy="390" r="28"
          fill="#8E9089" stroke="#222" stroke-width="1"/>
  <!-- gear teeth suggestion -->
  <circle cx="90" cy="390" r="22" fill="none" stroke="#545454" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- ═══════════════════════ KNOB ══════════════════════════════════════ -->
  <!-- Coin crank knob -->
  <circle id="part-knob" data-part="knob"
          cx="90" cy="420" r="14"
          fill="#C12E1F" stroke="#222" stroke-width="1.5"/>

  <!-- ═══════════════════════ MOUTH (output tray slot) ══════════════════ -->
  <rect id="part-mouth" data-part="mouth"
        x="100" y="420" width="130" height="30" rx="10"
        fill="#545454" stroke="#222" stroke-width="1.5"/>
  <!-- slot opening -->
  <rect x="110" y="426" width="110" height="12" rx="6" fill="#111"/>

  <!-- ═══════════════════════ MID-PLATE ═════════════════════════════════ -->
  <rect id="part-mid-plate" data-part="mid-plate"
        x="35" y="308" width="230" height="18" rx="3"
        fill="#545454" stroke="#222" stroke-width="1.5"/>

  <!-- ═══════════════════════ HOLE BLOCKER ══════════════════════════════ -->
  <rect id="part-hole-blocker" data-part="hole-blocker"
        x="90" y="280" width="120" height="28" rx="4"
        fill="#FFFFFF" stroke="#222" stroke-width="1"/>

  <!-- ═══════════════════════ MAIN GEAR ═════════════════════════════════ -->
  <circle id="part-main-gear" data-part="main-gear"
          cx="150" cy="250" r="38"
          fill="#8E9089" stroke="#222" stroke-width="1.5"/>
  <circle cx="150" cy="250" r="30" fill="none" stroke="#545454" stroke-width="2" stroke-dasharray="8 5"/>
  <circle cx="150" cy="250" r="10" fill="#545454"/>

  <!-- ═══════════════════════ TOP CHAMBER ═══════════════════════════════ -->
  <!-- Upper dome housing (where capsules sit) -->
  <rect id="part-top-chamber" data-part="top-chamber"
        x="40" y="100" width="220" height="160" rx="8"
        fill="#0056B8" stroke="#222" stroke-width="1.5"/>

  <!-- ═══════════════════════ WINDOW ════════════════════════════════════ -->
  <!-- Transparent window on front of top chamber -->
  <ellipse id="part-window" data-part="window"
           cx="150" cy="175" rx="75" ry="60"
           fill="#0086D6" fill-opacity="0.6" stroke="#222" stroke-width="1"/>

  <!-- ═══════════════════════ LID LOCK ══════════════════════════════════ -->
  <rect id="part-lid-lock" data-part="lid-lock"
        x="130" y="88" width="40" height="16" rx="4"
        fill="#545454" stroke="#222" stroke-width="1"/>

  <!-- ═══════════════════════ LID ═══════════════════════════════════════ -->
  <!-- Rounded cap at top -->
  <rect id="part-lid" data-part="lid"
        x="50" y="50" width="200" height="52" rx="26"
        fill="#00AE42" stroke="#222" stroke-width="1.5"/>

  <!-- ═══════════════════════ REAR LOCK KNOB ════════════════════════════ -->
  <!-- Shown as a side detail at lower-right -->
  <circle id="part-rear-lock-knob" data-part="rear-lock-knob"
          cx="270" cy="360" r="12"
          fill="#C12E1F" stroke="#222" stroke-width="1.5"/>

  <!-- ═══════════════════════ BACK COVER ════════════════════════════════ -->
  <!-- Shown as a thin strip on the right edge -->
  <rect id="part-back-cover" data-part="back-cover"
        x="258" y="100" width="18" height="355" rx="4"
        fill="#545454" stroke="#222" stroke-width="1"/>

  <!-- ═══════════════════════ LABEL ═════════════════════════════════════ -->
  <text x="150" y="74" text-anchor="middle" font-family="sans-serif"
        font-size="11" fill="#FFFFFF" font-weight="bold">Gata-Gata</text>

</svg>
