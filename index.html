<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gata-Gata Gacha Machine — Color Customizer</title>
  <link rel="stylesheet" href="src/styles.css" />

  <!-- jsPDF via CDN (no bundler required for Phase 1) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
          crossorigin="anonymous"></script>
</head>
<body>
  <div id="app">

    <!-- ── Header ─────────────────────────────────────────────────────── -->
    <header>
      <h1>⚙️ Gata-Gata Gacha Machine — Color Customizer</h1>
      <div class="header-actions">
        <button id="btn-share" class="btn btn-secondary" title="Copy shareable link">
          🔗 Share
        </button>
        <button id="btn-export-pdf" class="btn btn-primary" title="Export build blueprint PDF">
          📄 Export PDF
        </button>
      </div>
    </header>

    <!-- ── Parts sidebar ──────────────────────────────────────────────── -->
    <aside id="sidebar">
      <h2>Parts</h2>
      <ul id="parts-list"></ul>

      <!-- Windows material selector -->
      <div id="windows-material-selector">
        <h3>Windows</h3>
        <label class="windows-option">
          <input type="radio" name="windows-material" value="printed" id="windows-printed" checked />
          3D printed windows
        </label>
        <label class="windows-option">
          <input type="radio" name="windows-material" value="acrylic" id="windows-acrylic" />
          Clear acrylic windows
        </label>
      </div>
    </aside>

    <!-- ── 2D Viewer ──────────────────────────────────────────────────── -->
    <div id="viewer-wrap">
      <div id="view-selector" role="tablist" aria-label="Machine view selector">
        <button class="view-tab active" type="button" data-view="front" role="tab" aria-selected="true">
          Front
        </button>
        <button class="view-tab" type="button" data-view="side" role="tab" aria-selected="false">
          Side
        </button>
        <button class="view-tab" type="button" data-view="back" role="tab" aria-selected="false">
          Back
        </button>
      </div>
      <div id="viewer-stage">
        <div id="viewer">
          <p style="color:#8892a4;font-size:0.9rem;">Loading machine preview…</p>
        </div>
      </div>
    </div>

    <!-- ── Color palette panel ────────────────────────────────────────── -->
    <section id="palette-panel">
      <h2>Bambu PLA Colors</h2>
      <div id="selected-info">
        <span id="selected-color"></span>
      </div>
      <div id="palette-scroll">
        <div id="palette-grid"></div>
      </div>
      <div id="color-name"></div>
    </section>

    <!-- ── Footer ─────────────────────────────────────────────────────── -->
    <footer>
      <span>Lightning Bug Club &mdash; <a href="https://lightningbugclub.com" target="_blank" rel="noopener">lightningbugclub.com</a></span>
      <span>Phase 1: 2D Orthographic &mdash; Phase 2: Three.js 3D (roadmap)</span>
    </footer>

  </div>

  <!-- App entry point (ES module) -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
